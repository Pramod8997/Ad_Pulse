name: adpulse-local

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
    profiles: [local]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-AdPulseLocal!2026}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./db:/workspace/db:ro
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  scorer:
    image: python:3.10-slim
    profiles: [local]
    working_dir: /workspace/scoring
    volumes:
      - ./:/workspace
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: >-
      sh -c "python -m pip install --disable-pip-version-check --no-cache-dir -e . 'uvicorn>=0.30,<1'
      && python -m uvicorn adpulse_scoring.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "${SCORER_PORT:-8000}:8000"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: [local]
    working_dir: /workspace
    volumes:
      - ./:/workspace
    command: >-
      dotnet run --project src/AdPulse.Api/AdPulse.Api.csproj
      --configuration Release --no-launch-profile --urls http://0.0.0.0:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__AdPulse: Server=sqlserver,1433;Database=AdPulse;User Id=sa;Password=${MSSQL_SA_PASSWORD:-AdPulseLocal!2026};TrustServerCertificate=True
      Scoring__BaseUrl: http://scorer:8000
      Identity__Authority: http://localhost:8081
      Identity__Audience: adpulse-api
      Identity__RequireHttpsMetadata: "false"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      scorer:
        condition: service_healthy

volumes:
  sqlserver-data:
