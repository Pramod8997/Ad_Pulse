name: Phase 2 checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AdPulse.sln

      - name: Build
        run: dotnet build AdPulse.sln --configuration Release --no-restore --verbosity minimal

      - name: Test
        run: dotnet test AdPulse.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=phase2-dotnet.trx"

  python:
    name: Python scoring checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install scoring test dependencies
        working-directory: scoring
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      - name: Test scoring service
        working-directory: scoring
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q scoring

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
