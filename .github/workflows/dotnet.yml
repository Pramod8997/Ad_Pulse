name: .NET

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AdPulse.sln

      - name: Build
        run: dotnet build AdPulse.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AdPulse.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install scoring test dependencies
        working-directory: scoring
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      - name: Test scoring service
        working-directory: scoring
        run: python -m pytest -q
